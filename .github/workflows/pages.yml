# The developer documentation (site/), built by Astro and published to
# GitHub Pages at https://agentplot.github.io/sluice. Once, by hand, the
# repository's Pages source must be set to "GitHub Actions" (Settings →
# Pages → Build and deployment → Source); after that every push to main
# that touches the site or the documents it is generated from deploys.
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The prose, by Vale, before anything is built (.vale.ini).
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - run: devenv shell -- prose

  build:
    needs: prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: site
      # The build draws the diagrams in a headless Chromium (astro.config.mjs).
      - run: bunx playwright install --with-deps chromium
        working-directory: site
      - run: bun run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

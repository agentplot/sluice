# sluice on GitHub: the flake builds on macOS and Linux, the fast tier runs
# in the devenv shell a session uses, and a tag publishes each platform's
# binaries to a release. sluice's own gate is sluice (.config/sluice.toml);
# this is the public build.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default --print-build-logs
      - run: ./result/bin/sluice --help

  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - run: devenv shell -- moon run ':#check-fast'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, fast]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default
      - run: tar -czf "sluice-${GITHUB_REF_NAME}-${{ matrix.system }}.tar.gz" -C result/bin sluice wt-submit
      - uses: softprops/action-gh-release@v2
        with:
          files: sluice-*.tar.gz

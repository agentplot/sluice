# sluice on GitHub tests a tree once. sluice's own gate is sluice
# (.config/sluice.toml), on macOS under its sandbox; a pull request runs
# here only what that gate cannot: the fast tier and the deeper tiers on
# Linux, in the devenv shell a session uses, and the commit messages. A
# push to main that is a sluice landing carries the tree that gate and the
# pull request's Linux run passed (core.17), so it builds and tests
# nothing and goes straight to its release; a push to main no landing made
# is built on macOS and Linux and tested whole first. Each push to main
# that git-cliff finds a new version in is released (cliff.toml), under a
# tag that names a release commit cut from the pushed commit, in which
# set-version.sh writes the release's version into every file that carries
# sluice's; main's tree names 0.0.0 (record 0111, core.55). The release
# branch, which the Claude Code marketplace is read at, moves to each
# release commit with its tag (record 0112).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The candidate a push to main landed, from the head's Sluice-Tested
  # trailer as git reads trailers; empty on a pull request, which has no
  # head commit, and on a push no landing made.
  landing:
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.trailer.outputs.tested }}
    steps:
      - id: trailer
        run: |
          tested="$(printf '%s\n' "$MESSAGE" | git interpret-trailers --parse | sed -n 's/^Sluice-Tested: //p')"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
        env:
          MESSAGE: ${{ github.event.head_commit.message }}

  # The flake, only on a push no landing made.
  build:
    needs: landing
    if: github.event_name == 'push' && needs.landing.outputs.tested == ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default --print-build-logs
      - run: ./result/bin/sluice --help

  # The fast tier: on Linux alone for a pull request, whose macOS run is
  # sluice's gate's, and on both for a push no landing made.
  fast:
    needs: landing
    if: needs.landing.outputs.tested == ''
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # On a pull request moon compares the change against its base
      # branch, `main` by name: it needs the history and the branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: git branch main origin/main
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: fast-${{ runner.os }}-${{ hashFiles('Cargo.lock', '.prototools') }}
          restore-keys: fast-${{ runner.os }}-
      - run: devenv shell -- moon run ':#check-fast'

  # The tiers sluice's own gate runs on the macOS host it lands from, here
  # on Linux: the profiles against real git, moon and worktrunk, and e2e.
  # The sandbox tests are the host's (Seatbelt) and are not run.
  linux:
    needs: landing
    if: needs.landing.outputs.tested == ''
    runs-on: ubuntu-latest
    steps:
      # As in `fast`: moon compares a pull request against `main`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: git branch main origin/main
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-${{ hashFiles('Cargo.lock', '.prototools') }}
          restore-keys: linux-
      - run: devenv shell -- moon run ':#check-tools' ':#check-e2e'

  # The commits since the last release are conventional (.versionrc): a
  # session can skip the commit-msg hook, and git-cliff releases from them.
  # Merge commits are not checked, nor a commit `git revert` wrote, whose
  # subject opens `Revert "`, as the hook takes it (devenv.nix). The last
  # release is the newest v* tag by version, whose release commit is off
  # main, its one parent the commit it released: the range from it is the
  # commits main took since.
  conventional:
    needs: landing
    if: needs.landing.outputs.tested == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: |
          last="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          nix shell --inputs-from . nixpkgs#convco -c convco check --ignore-reverts ${last:+"$last..HEAD"}

  # The next version from the commits since the newest v* tag; empty when
  # it is already tagged. `--unreleased` starts the range at the newest tag,
  # which is off main's history.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - id: next
        run: |
          tag="$(nix shell --inputs-from . nixpkgs#git-cliff -c git-cliff --unreleased --bumped-version)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  # Each platform's binaries, built from the tree the release's tag will
  # name: the pushed commit with the release's version written
  # (set-version.sh). The flake's source is the checkout's tracked files, so
  # the build is the one any builder of the tag makes, given nothing, and it
  # fails unless the binary says the release's version (record 0111). A
  # landing's tests were skipped, its tree passed already; any other push's
  # must each have passed. A skipped job skips what needs it unless the
  # condition says otherwise, hence !cancelled().
  binaries:
    if: |-
      !cancelled() && needs.version.outputs.tag != '' &&
      (needs.landing.outputs.tested != '' ||
       (needs.build.result == 'success' && needs.fast.result == 'success' &&
        needs.linux.result == 'success' && needs.conventional.result == 'success'))
    needs: [landing, version, build, fast, linux, conventional]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: |
          sh set-version.sh "${TAG#v}"
          nix build .#default --print-build-logs
          test "$(./result/bin/sluice --version)" = "sluice ${TAG#v}"
        env:
          TAG: ${{ needs.version.outputs.tag }}
      - run: tar -czf "sluice-${{ matrix.system }}.tar.gz" -C result/bin sluice wt-submit
      - uses: actions/upload-artifact@v4
        with:
          name: sluice-${{ matrix.system }}
          path: sluice-${{ matrix.system }}.tar.gz

  # git-cliff's notes for the range, then the release commit: the pushed
  # commit, its one parent, with the release's version written into the
  # files set-version.sh lists, committed by path. The tag names it, and
  # the tag and release, the branch the marketplace is read at, are pushed
  # in one atomic push: the tag never forced, release forced to the release
  # commit, since each release commit's parent is main's pushed commit. The
  # binaries are published under the tag. Nothing is committed to main,
  # which only sluice lands, and no tag moves (records 0111 and 0112,
  # core.55). A test job a landing skipped would skip it too, as it would
  # binaries.
  release:
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    needs: [version, binaries]
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: |
          nix shell --inputs-from . nixpkgs#git-cliff -c \
            git-cliff --unreleased --tag "$TAG" --strip all > notes.md
          sh set-version.sh "${TAG#v}"
          mapfile -t files < <(sh set-version.sh --files)
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore(release): $TAG" -- "${files[@]}"
          git tag "$TAG"
          git push --atomic origin "refs/tags/$TAG" "+HEAD:refs/heads/release"
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file notes.md sluice-*.tar.gz
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}

$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: a candidate is held to what the commit hooks
# hold a commit to.
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree. It reads every tracked file: one
  # that no formatter claims and no exclude names fails it (core.21).
  format:
    command: 'treefmt --ci'
    inputs: ['/**/*']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy --workspace --all-targets -- -D warnings'
    inputs: ['/crates/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The Claude Code marketplace, which spans the plugins: it validates, and
  # every plugin it lists has a manifest. Each plugin's own checks are its
  # project's (plugins/*/moon.yml).
  marketplace:
    command: 'plugins/check-marketplace.sh'
    inputs: ['/.claude-plugin/**/*', '/plugins/*/.claude-plugin/plugin.json', '/plugins/check-marketplace.sh', '/plugins/claude.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}

$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: a candidate is held to what the commit hooks
# hold a commit to.
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree. It reads every tracked file: one
  # that no formatter claims and no exclude names fails it (core.21).
  format:
    command: 'treefmt --ci'
    inputs: ['/**/*']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy --workspace --all-targets -- -D warnings'
    inputs: ['/crates/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # rustc, cargo, clippy and rustfmt are the build .prototools pins, on
  # whichever host runs the gate (core.24). It reads the tools it checks
  # from outside the tree, so it never replays.
  toolchain:
    command: 'sh check-toolchain.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # The Claude Code marketplace, which spans the plugins: it validates, and
  # every plugin it lists has a manifest. Each plugin's own checks are its
  # project's (plugins/*/moon.yml).
  marketplace:
    command: 'plugins/check-marketplace.sh'
    inputs: ['/.claude-plugin/**/*', '/plugins/*/.claude-plugin/plugin.json', '/plugins/check-marketplace.sh', '/plugins/claude.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The scene the plugins' screenshots are taken of, built --fast with the
  # sluice built here and asserted, so a change to sluice that breaks it
  # fails here and not at the next retake. It reads the tools it drives from
  # outside the tree, so it never replays. The gate runs it; CI does not,
  # since the screenshots are taken only on a Mac.
  screenshots-scene:
    command: 'bash plugins/screenshots-scene.sh --check'
    # The scene and the sluice it builds from this tree.
    inputs: ['/plugins/screenshots-scene.sh', '/crates/sluice/**/*', '/crates/sluice-seams/**/*', '/crates/sluice-core/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock']
    tags: [check-e2e]
    options: {runFromWorkspaceRoot: true, cache: false, runInCI: false}
  # The screenshots themselves (plugins/screenshots-capture.sh), run by hand
  # in devenv shell: the gate cannot, since it drives a GUI terminal and a
  # logged-in Claude Code. No tag puts it in a tier.
  screenshots:
    command: 'bash plugins/screenshots-capture.sh'
    options: {runFromWorkspaceRoot: true, cache: false, runInCI: false}

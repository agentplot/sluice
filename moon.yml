$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: a candidate is held to what the commit hooks
# hold a commit to.
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree.
  format:
    command: 'treefmt --ci'
    inputs: ['/**/*.rs', '/**/*.nix', '/**/*.sh', '/**/*.toml', '/**/*.yml', '/**/*.yaml', '/**/*.ts', '/**/*.tsx', '/**/*.mjs', '/**/*.css', '/**/*.json', '/**/*.py', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy --workspace --all-targets -- -D warnings'
    inputs: ['/crates/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The Claude Code plugin's hooks on a scratch repository.
  plugin-hooks:
    command: 'plugins/sluice/tests/hooks.sh'
    inputs: ['/plugins/sluice/scripts/**/*', '/plugins/sluice/tests/**/*', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The board mod: its manifest validated, its modules typed against the
  # pinned Claude Code's engine-types, and its tests run by that engine.
  plugin-board:
    command: 'plugins/sluice-board/tests/check.sh'
    inputs: ['/plugins/sluice-board/**/*', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The Claude Code marketplace and every plugin it lists, validated.
  plugin-manifests:
    command: 'plugins/check-manifests.sh'
    inputs: ['/.claude-plugin/**/*', '/plugins/**/*', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The herdr plugin's scripts against stand-in herdr and sluice, under sh
  # and dash.
  plugin-herdr:
    command: 'plugins/herdr/tests/shells.sh'
    inputs: ['/plugins/herdr/**/*', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}

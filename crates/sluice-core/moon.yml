    command: 'cargo test -p sluice-core'
    inputs: ['/crates/sluice-core/**/*', '/crates/sluice-seams/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock']
    tags: [cargo-test, check-fast]
    options: {runFromWorkspaceRoot: true}

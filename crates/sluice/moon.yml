$schema: 'https://moonrepo.dev/schemas/project.json'

dependsOn: [seams, core, fakes]

tasks:
  test:
    command: 'cargo test -p sluice'
    inputs: ['/crates/sluice/**/*', '/crates/sluice-seams/**/*', '/crates/sluice-core/**/*', '/crates/sluice-fakes/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock']
    tags: [cargo-test, check-fast]
    options: {runFromWorkspaceRoot: true}
  # The profiles against real tools (git, moon, wt), and the conformance
  # scenarios that need no fault on them: the check-tools tier.
  tools:
    command: 'cargo test -p sluice --features tools --test local_refs --test moon --test places --test worktrunk --test protect --test conformance'
    inputs: ['/crates/sluice/**/*', '/crates/sluice-seams/**/*', '/crates/sluice-core/**/*', '/crates/sluice-fakes/**/*', '/crates/sluice-conformance/src/**/*', '/crates/sluice-conformance/Cargo.toml', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock']
    tags: [check-tools]
    options: {runFromWorkspaceRoot: true}
  # S1 to S4 through wt submit on scratch repositories: the check-e2e tier.
  # It reads the tools it drives from outside the tree, so it never replays.
  e2e:
    command: 'bash e2e/check.sh'
    tags: [check-e2e]
    options: {runFromWorkspaceRoot: true, cache: false}

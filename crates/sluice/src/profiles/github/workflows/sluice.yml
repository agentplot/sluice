# sluice's round job (137, C.8): it takes the pull requests of each branch
# the forge keeps in, and runs that branch's rounds, with every host's
# sluice stopped. `sluice init actions` wrote it at sluice {{version}}; run
# that command again rather than editing it, and `sluice forge check
# <branch>` says whether it is what this version writes.
#
# A round of one branch runs when a submit or a recorded result asks for
# it (`mode: round`), and every five minutes for each branch the forge
# keeps, which takes in a pull request a person opened. One round job of a
# branch runs at a time. Only this job holds the `sluice` environment, and
# with it the app's key.
name: sluice
run-name: sluice ${{ inputs.claim || 'round' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to run; `round` runs a branch's rounds.
        required: true
        default: round
      branch:
        description: The branch whose rounds to run; none wakes each one.
        required: false
        default: ""
      claim:
        description: The claim the job runs under.
        required: false
        default: ""
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  round:
    if: inputs.mode == 'round' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: sluice
    timeout-minutes: 55
    concurrency:
      group: sluice-round-${{ inputs.branch || 'schedule' }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SLUICE_VERSION: "{{version}}"
      BRANCH: ${{ inputs.branch }}
    steps:
      # An empty repository whose origin is this one, its branches fetched
      # with the job's own read-only token, which nothing keeps; sluice's
      # own fetches and pushes carry the app's token (124, C.6).
      - name: The repository
        run: |
          git init -q -b "$DEFAULT" .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          {
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/sluice/config"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/sluice/state"
          } >> "$GITHUB_ENV"
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
          TOKEN: ${{ github.token }}
      - name: sluice
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL \
            "https://github.com/agentplot/sluice/releases/download/v$SLUICE_VERSION/sluice-x86_64-linux.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # What the last round job of the branch kept: GitHub's answers for
      # each address, and when it first saw the branch's records (73, 136).
      - name: The state the last round job kept
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/sluice/state
            .git/sluice-remote
          key: sluice-round-${{ inputs.branch || 'schedule' }}-${{ github.run_id }}
          restore-keys: sluice-round-${{ inputs.branch || 'schedule' }}-
      - name: The app's key
        run: |
          umask 077
          mkdir -p "$XDG_CONFIG_HOME/sluice"
          printf '%s\n' "$SLUICE_APP_KEY" > "$RUNNER_TEMP/sluice/app.pem"
          chmod 600 "$RUNNER_TEMP/sluice/app.pem"
          printf '[forge]\napp_id = %s\nkey = "%s"\n' \
            "$SLUICE_APP_ID" "$RUNNER_TEMP/sluice/app.pem" > "$XDG_CONFIG_HOME/sluice/config.toml"
        env:
          SLUICE_APP_ID: ${{ vars.SLUICE_APP_ID }}
          SLUICE_APP_KEY: ${{ secrets.SLUICE_APP_KEY }}
      - name: The round
        run: |
          if [ -n "$BRANCH" ]; then
            sluice job round --branch "$BRANCH"
          else
            sluice job round
          fi
      - name: The state for the next round job
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/sluice/state
            .git/sluice-remote
          key: sluice-round-${{ inputs.branch || 'schedule' }}-${{ github.run_id }}

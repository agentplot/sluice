[package]
name = "sluice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A merge queue for agents in worktrees."

[[bin]]
name = "sluice"
path = "src/main.rs"

# worktrunk runs any `wt-<name>` on the path as `wt <name>`: the driver
# profile's front door, forwarding to `sluice submit`.
[[bin]]
name = "wt-submit"
path = "src/profiles/worktrunk/wt_submit.rs"

[dependencies]
sluice-seams = { path = "../sluice-seams" }
sluice-core = { path = "../sluice-core" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
gix.workspace = true
nix.workspace = true
chrono.workspace = true
toml.workspace = true

# A profile's acceptance tests that name its tool live under a profile
# directory (rule core.1).
[[test]]
name = "moon"
path = "tests/profiles/moon.rs"

[[test]]
name = "places"
path = "tests/profiles/places.rs"

[[test]]
name = "worktrunk"
path = "tests/profiles/worktrunk.rs"

[[test]]
name = "conformance"
path = "tests/profiles/conformance.rs"

[features]
# The acceptance tests that need a real tool (git), the check-tools tier.
tools = []

[dev-dependencies]
sluice-fakes = { path = "../sluice-fakes" }
sluice-conformance = { path = "../sluice-conformance" }

[lib]
doctest = false

[lints]
workspace = true

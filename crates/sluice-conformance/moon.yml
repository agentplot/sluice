$schema: 'https://moonrepo.dev/schemas/project.json'

dependsOn: [seams, core, fakes]

tasks:
  test:
    command: 'cargo test -p sluice-conformance'
    inputs: ['/crates/sluice-conformance/**/*', '/crates/sluice-seams/**/*', '/crates/sluice-core/**/*', '/crates/sluice-fakes/**/*', '/docs/examples/state/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock']
    tags: [cargo-test, check-fast]
    options: {runFromWorkspaceRoot: true}

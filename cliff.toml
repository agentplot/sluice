# git-cliff: the next version and the release notes, from the
# conventional commits since the last v* tag. CI releases with it on each
# push to main; `devenv shell -- release-preview` shows what would be
# released. The version lives only in the tag.

[changelog]
header = ""
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/agentplot/sluice/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/agentplot/sluice/issues/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [{ pattern = '(?m)^Co-Authored-By:.*$', replace = "" }]
# The HTML comments order the groups; the body strips them.
commit_parsers = [
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { body = "BREAKING[ -]CHANGE", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactors" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^chore", skip = true },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"

# sluice's gate for its own branches (docs/plans/phase-1-integrations.md,
# section 9). Read from each branch's own revision (core.15).

[tests]
runner = "moon"
# Printed outside the executor and sourced inside it (section 4).
toolchain = ["devenv", "print-dev-env"]

[executor]
kind = "sandbox"
# The integration tests listen on localhost; nothing reaches further.
network = "localhost"
# The stack and e2e tests start their containers and wait for them within
# their own limit (66; ADR 0016).
docker = true

# The hosts whose runs count, each by the public half of the key its own
# [signing] names. Naming any keeps the state of every branch with a remote
# on that remote (C.6), where the host that keeps main takes main's pull
# requests in (137; record 0103). sessions is deneb, where the sessions work:
# it runs agents, so nothing it signs is confined (79).
[signers.sessions]
ssh = "deneb ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHGx/Ip3yodP/Rg3DdMAjJXoYuBmMxTLpPrka3ei69M/ sluice deneb"

[branches."bolt/*"]
required = ["#check-fast"]
# A run counts, and a replay through a pass recorded for its key (108), only
# where sessions signed it (78).
trust = ["sessions"]
# Bolts live on GitHub, as main does: crew pushes each new one there, and
# sluice lands on it by a leased push, so agents on any host share it.
remote = "origin"

# Until a confined signer is named, main counts what sessions signed, as the
# bolts do (78, 108).
[branches.main]
required = ["#check-fast", "#check-tools", "#check-e2e"]
batch = true
trust = ["sessions"]
# main lives on GitHub: fetched every round, landed by a leased push.
remote = "origin"

# main takes its work as pull requests on GitHub (C.7): a submit pushes the
# agent's branch and opens its pull request, which sluice submits once it
# meets these, and tests and lands as any other. sluice's gate is the one
# above, so a pull request waits on nothing more.
[branches.main.pull_requests]
reviews = 0

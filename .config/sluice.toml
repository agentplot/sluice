# sluice's gate for its own branches (docs/plans/phase-1-integrations.md,
# section 9). Read from each branch's own revision (core.15).

[tests]
runner = "moon"
# Printed outside the executor and sourced inside it (section 4).
toolchain = ["devenv", "print-dev-env"]
# The stack and e2e tests need the container engine: a host whose engine
# does not answer is refused the run, or, when it stops during one, leaves
# its fails unjudged rather than recorded (could-not-run-1 114; ADR 0031).
ready = ["docker", "info"]

# A run's compiles go through the host's compile cache, sccache, which
# the development shell puts on its PATH (35; ADR 0049). Sandboxed, as
# sluice's runs are, a run keeps a server of its own over the host's
# compile-cache directory while it holds it; an open run, such as one on a
# host with no sandbox, finds the host's server through the variables the
# hosts' keepers set for it and its shells, named here.
[checkout]
compile_cache = "sccache"
compile_cache_variables = [
  "SCCACHE_SERVER_UDS",
  "SCCACHE_SERVER_PORT",
  "SCCACHE_DIR",
]

[executor]
kind = "sandbox"
# The integration tests listen on localhost; nothing reaches further.
network = "localhost"
# The stack test starts containers (ADR 0016).
docker = true

[branches."bolt/*"]
required = ["#check-fast"]
# A replay counts when a run this gate trusts recorded a pass for its key
# (108).
trust = ["open", "sandbox", "container"]
# Bolts live on GitHub, as main does: crew pushes each new one there, and
# sluice lands on it by a leased push, so agents on any host share it.
remote = "origin"

# On one Mac, until runs are confined, main accepts sandboxed runs too. A
# replay counts only when a sandboxed or confined run recorded a pass for its
# key (108): the cache also holds what open shells ran.
[branches.main]
required = ["#check-fast", "#check-tools", "#check-e2e"]
batch = true
trust = ["confined", "sandbox"]
# main lives on GitHub: fetched every round, landed by a leased push.
remote = "origin"

# main takes its work as pull requests on GitHub (C.7): a submit pushes the
# agent's branch and opens its pull request, which sluice submits once it
# meets these, and tests and lands as any other. sluice's gate is the one
# above, so a pull request waits on nothing more.
[branches.main.pull_requests]
reviews = 0

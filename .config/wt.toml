# Project configuration for worktrunk. Every command runs inside
# `devenv shell`, so a hook builds with the same toolchain a session does.
# The per-commit floor (treefmt, clippy) is git's own pre-commit hook,
# installed by devenv from devenv.nix.

# Before a branch lands: every crate's cargo tests through moon, which replays every crate
# whose inputs already passed in any worktree, then the disk check.
[[pre-merge]]
cargo-tests = "devenv shell -- cargo-tests"
disk = "devenv shell -- disk"

# A new worktree takes the main worktree's build cache (.worktreeinclude).
[post-start]
copy = "wt step copy-ignored"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Tested at once, and the host's bound</title>
<desc id="dsc">Left: how many of a branch's combinations are tested at once. It starts at parallel, 4; each failure halves it, to 2 then 1; each pass adds one back, to 2, 3 and 4. sluice status shows it as testing 1 at once, up to 4. Right: the host's bound, runs max, caps every branch together: here 4 runs, shared by main, two bolts and an agent's own sluice exec.</desc>
<style>
:root{--bg:#f6f7f8;--panel:#ffffff;--fg:#1d2329;--muted:#5b6670;--rule:#d6dbe0;
--accent:#1b6d8a;--soft:#e3eef3;--ok:#2e7d4f;--bad:#c0392b;--ink:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#141a1f;--panel:#1b2329;--fg:#e6ebef;
--muted:#9aa7b2;--rule:#2c3740;--accent:#6fc2de;--soft:#1f2f38;--ok:#6cc58f;--bad:#f08a7e;--ink:#0f1a20}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono,.bart{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg)} .t{fill:var(--fg)} .m{fill:var(--muted)} .ok{fill:var(--ok)} .bad{fill:var(--bad)}
.b{font-weight:600} .h{font-size:17px;font-weight:700} .hd{font-size:12px;letter-spacing:.06em;fill:var(--muted)}
.sm{font-size:13px} .xs{font-size:11.5px} .mono{font-size:12.5px}
.panel{fill:var(--soft);stroke:none}
.track{fill:var(--panel);stroke:var(--rule);stroke-width:1}
.bar{transform-box:fill-box;transform-origin:left center}
.bart{fill:var(--ink);font-size:11.5px;font-weight:600}
.wait{stroke:var(--muted);stroke-width:2;stroke-dasharray:4 4;transform-box:fill-box;transform-origin:left center}
.axis{stroke:var(--rule);stroke-width:1} .tick{fill:var(--muted);font-size:11px}
.play{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
.merge{fill:var(--ok)} .mergein{fill:var(--panel)}
.badge{fill:var(--accent)} .badget{fill:var(--ink);font-size:12px;font-weight:700}
.step{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.dot{fill:var(--accent)} .grid{stroke:var(--rule);stroke-width:1}
.slot{fill:var(--panel);stroke:var(--rule);stroke-width:1.5} .used{fill:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important;animation-delay:-16.5s!important}
.cap{animation:none!important;opacity:1}}
@keyframes k1{0%{stroke-dashoffset:710} 4%{stroke-dashoffset:710} 82%{stroke-dashoffset:0} 97%{stroke-dashoffset:0} 100%{stroke-dashoffset:710}}.k1{animation:k1 18s linear infinite}@keyframes k2{0%{opacity:0} 14.5429%{opacity:0} 15.1429%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k2{animation:k2 18s linear infinite}@keyframes k3{0%{opacity:0} 14.5429%{opacity:0} 15.1429%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k3{animation:k3 18s linear infinite}@keyframes k4{0%{opacity:0} 25.6857%{opacity:0} 26.2857%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k4{animation:k4 18s linear infinite}@keyframes k5{0%{opacity:0} 25.6857%{opacity:0} 26.2857%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k5{animation:k5 18s linear infinite}@keyframes k6{0%{opacity:0} 36.8286%{opacity:0} 37.4286%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k6{animation:k6 18s linear infinite}@keyframes k7{0%{opacity:0} 36.8286%{opacity:0} 37.4286%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k7{animation:k7 18s linear infinite}@keyframes k8{0%{opacity:0} 47.9714%{opacity:0} 48.5714%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k8{animation:k8 18s linear infinite}@keyframes k9{0%{opacity:0} 47.9714%{opacity:0} 48.5714%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k9{animation:k9 18s linear infinite}@keyframes k10{0%{opacity:0} 59.1143%{opacity:0} 59.7143%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k10{animation:k10 18s linear infinite}@keyframes k11{0%{opacity:0} 59.1143%{opacity:0} 59.7143%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k11{animation:k11 18s linear infinite}@keyframes k12{0%{opacity:0} 70.2571%{opacity:0} 70.8571%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k12{animation:k12 18s linear infinite}@keyframes k13{0%{opacity:0} 70.2571%{opacity:0} 70.8571%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k13{animation:k13 18s linear infinite}@keyframes k14{0%{opacity:0} 25.6857%{opacity:0} 26.2857%{opacity:1} 37.4286%{opacity:1} 38.0286%{opacity:0} 100%{opacity:0}}.k14{animation:k14 18s linear infinite}@keyframes k15{0%{opacity:0} 9.4%{opacity:0} 10%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k15{animation:k15 18s linear infinite}@keyframes k16{0%{opacity:0} 9.4%{opacity:0} 10%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k16{animation:k16 18s linear infinite}@keyframes k17{0%{opacity:0} 29.4%{opacity:0} 30%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k17{animation:k17 18s linear infinite}@keyframes k18{0%{opacity:0} 49.4%{opacity:0} 50%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k18{animation:k18 18s linear infinite}@keyframes k19{0%{opacity:0} 65.4%{opacity:0} 66%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k19{animation:k19 18s linear infinite}@keyframes k20{0%{opacity:0.35} 1.4%{opacity:0.35} 2%{opacity:1} 44%{opacity:1} 44.6%{opacity:0.35} 100%{opacity:0.35}}.k20{animation:k20 18s linear infinite}@keyframes k21{0%{opacity:0.35} 43.4%{opacity:0.35} 44%{opacity:1} 62%{opacity:1} 62.6%{opacity:0.35} 100%{opacity:0.35}}.k21{animation:k21 18s linear infinite}@keyframes k22{0%{opacity:0.35} 61.4%{opacity:0.35} 62%{opacity:1} 97%{opacity:1} 97.6%{opacity:0.35} 100%{opacity:0.35}}.k22{animation:k22 18s linear infinite}</style>
<rect class="bg" width="900" height="440" rx="10"/>
<text class="h" x="20" y="32">How many are tested at once</text>
<rect class="panel" x="16" y="48" width="520" height="300" rx="8"/>
<text class="hd" x="34" y="70">ONE BRANCH · PARALLEL = 4</text>
<line class="grid" x1="80" y1="245" x2="510" y2="245"/>
<text class="tick" x="70" y="249" text-anchor="end">1</text>
<line class="grid" x1="80" y1="200" x2="510" y2="200"/>
<text class="tick" x="70" y="204" text-anchor="end">2</text>
<line class="grid" x1="80" y1="155" x2="510" y2="155"/>
<text class="tick" x="70" y="159" text-anchor="end">3</text>
<line class="grid" x1="80" y1="110" x2="510" y2="110"/>
<text class="tick" x="70" y="114" text-anchor="end">4</text>
<text class="m xs" x="34" y="96">tested at once</text>
<path class="step k1" style="stroke-dasharray:710" d="M80.0,110.0 L141.4,110.0 L141.4,200.0 L202.9,200.0 L202.9,245.0 L264.3,245.0 L264.3,200.0 L325.7,200.0 L325.7,155.0 L387.1,155.0 L387.1,110.0 L448.6,110.0 L448.6,110.0 L510.0,110.0"/>
<text class="xs bad k2" x="141.4" y="312" text-anchor="middle">failed</text>
<text class="m xs k3" x="141.4" y="327" text-anchor="middle">½</text>
<text class="xs bad k4" x="202.9" y="312" text-anchor="middle">failed</text>
<text class="m xs k5" x="202.9" y="327" text-anchor="middle">½</text>
<text class="xs ok k6" x="264.3" y="312" text-anchor="middle">passed</text>
<text class="m xs k7" x="264.3" y="327" text-anchor="middle">+1</text>
<text class="xs ok k8" x="325.7" y="312" text-anchor="middle">passed</text>
<text class="m xs k9" x="325.7" y="327" text-anchor="middle">+1</text>
<text class="xs ok k10" x="387.1" y="312" text-anchor="middle">passed</text>
<text class="m xs k11" x="387.1" y="327" text-anchor="middle">+1</text>
<text class="xs ok k12" x="448.6" y="312" text-anchor="middle">passed</text>
<text class="m xs k13" x="448.6" y="327" text-anchor="middle">at most 4</text>
<g class="k14"><text class="t mono" x="300" y="211">testing 1 at once (up to 4)</text><text class="m xs" x="300" y="227">what sluice status says now</text></g>
<rect class="panel" x="548" y="48" width="336" height="300" rx="8"/>
<text class="hd" x="566" y="70">THE HOST · [runs] max = 4</text>
<text class="m xs" x="566" y="90">every branch, and agents' sluice exec, share it</text>
<rect class="slot" x="566" y="108" width="300" height="38" rx="6"/>
<text class="m xs" x="580" y="131">run 1: free</text>
<rect class="slot" x="566" y="158" width="300" height="38" rx="6"/>
<text class="m xs" x="580" y="181">run 2: free</text>
<rect class="slot" x="566" y="208" width="300" height="38" rx="6"/>
<text class="m xs" x="580" y="231">run 3: free</text>
<rect class="slot" x="566" y="258" width="300" height="38" rx="6"/>
<text class="m xs" x="580" y="281">run 4: free</text>
<g class="k15"><rect class="used" x="566" y="108" width="300" height="38" rx="6"/><text class="bart" x="580" y="131">run 1: main</text></g>
<g class="k16"><rect class="used" x="566" y="158" width="300" height="38" rx="6"/><text class="bart" x="580" y="181">run 2: main</text></g>
<g class="k17"><rect class="used" x="566" y="208" width="300" height="38" rx="6"/><text class="bart" x="580" y="231">run 3: bolt/a</text></g>
<g class="k18"><rect class="used" x="566" y="258" width="300" height="38" rx="6"/><text class="bart" x="580" y="281">run 4: sluice exec</text></g>
<text class="xs bad k19" x="566" y="334">bolt/b waits for a free run, whatever its parallel</text>
<g class="cap k20"><circle class="badge" cx="32" cy="388" r="11"/><text class="badget" x="32" y="392" text-anchor="middle">1</text><text class="t sm" x="50" y="384">A failure halves the number;</text><text class="t sm" x="50" y="401">a pass adds one back.</text></g>
<g class="cap k21"><circle class="badge" cx="324" cy="388" r="11"/><text class="badget" x="324" y="392" text-anchor="middle">2</text><text class="t sm" x="342" y="384">It never falls below one,</text><text class="t sm" x="342" y="401">nor rises above parallel.</text></g>
<g class="cap k22"><circle class="badge" cx="616" cy="388" r="11"/><text class="badget" x="616" y="392" text-anchor="middle">3</text><text class="t sm" x="634" y="384">The host's bound caps every</text><text class="t sm" x="634" y="401">branch together.</text></g>
</svg>

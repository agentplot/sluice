<rect class="bg" width="900" height="446" rx="10"/>
<text class="h" x="20" y="32">sluice</text>
<text class="m sm" x="80" y="32">a merge queue for agents in worktrees</text>
<text class="hd" x="20" y="62">AGENTS · EACH IN A WORKTREE</text>
<rect class="queue" x="268" y="44" width="380" height="306" rx="8"/>
<text class="hd" x="282" y="62">SLUICE · QUEUE OF bolt/pay</text>
<text class="m xs" x="296" y="88">entries</text>
<text class="hd" x="664" y="62">THE BRANCH</text>
<rect class="box sbA" x="20" y="80" width="200" height="72" rx="6"/>
<text class="t b" x="34" y="104">agent A</text>
<text class="m sm" x="34" y="122">worktree unit/auth</text>
<text class="m xs sA0" x="34" y="140">building…</text>
<text class="m xs sA1" x="34" y="140">submitted · waiting</text>
<text class="xs ok sA2" x="34" y="140">landed</text>
<rect class="box sbB" x="20" y="170" width="200" height="72" rx="6"/>
<text class="t b" x="34" y="194">agent B</text>
<text class="m sm" x="34" y="212">worktree unit/ledger</text>
<text class="m xs sB0" x="34" y="230">building…</text>
<text class="m xs sB1" x="34" y="230">submitted · waiting</text>
<text class="xs bad sB2" x="34" y="230">told: pkg-x:test failed</text>
<rect class="box sbC" x="20" y="260" width="200" height="72" rx="6"/>
<text class="t b" x="34" y="284">agent C</text>
<text class="m sm" x="34" y="302">worktree unit/export</text>
<text class="m xs sC0" x="34" y="320">building…</text>
<text class="m xs sC1" x="34" y="320">submitted · waiting</text>
<text class="xs ok sC2" x="34" y="320">landed</text>
<g class="cA"><rect class="chip chiprA" x="360" y="72" width="30" height="22" rx="4"/><text class="chipt" x="375" y="87" text-anchor="middle">A</text></g>
<g class="cB"><rect class="chip chiprB" x="400" y="72" width="30" height="22" rx="4"/><text class="chipt" x="415" y="87" text-anchor="middle">B</text></g>
<g class="cC"><rect class="chip chiprC" x="440" y="72" width="30" height="22" rx="4"/><text class="chipt" x="455" y="87" text-anchor="middle">C</text></g>
<g class="row">
<rect class="cand" x="282" y="112" width="352" height="62" rx="6"/>
<text class="t mono " x="296" y="136">branch + A</text>
<text class="xs m r1a" x="620" y="136" text-anchor="end">testing…</text>
<text class="xs ok r1b" x="620" y="136" text-anchor="end">passed</text>
<text class="xs ok r1c" x="620" y="136" text-anchor="end">landed</text>
<rect class="track" x="296" y="150" width="324" height="10" rx="5"/>
<rect class="bar bar1" x="296" y="150" width="324" height="10" rx="5"/>
</g>
<g class="row2">
<rect class="cand" x="282" y="192" width="352" height="62" rx="6"/>
<text class="t mono " x="296" y="216">branch + A + B</text>
<text class="xs m r2a" x="620" y="216" text-anchor="end">testing…</text>
<text class="xs bad r2b" x="620" y="216" text-anchor="end">failed: pkg-x:test</text>
<text class="xs bad r2c" x="620" y="216" text-anchor="end">B removed: culprit</text>
<rect class="track" x="296" y="230" width="324" height="10" rx="5"/>
<rect class="bar bar2" x="296" y="230" width="324" height="10" rx="5"/>
<line class="strike" x1="290" y1="212" x2="410" y2="212"/>
</g>
<g class="row">
<rect class="cand" x="282" y="272" width="352" height="62" rx="6"/>
<text class="t mono l3a" x="296" y="296">branch + A + B + C</text>
<text class="t mono l3b" x="296" y="296">branch + A + C</text>
<text class="xs m r3a" x="620" y="296" text-anchor="end">testing…</text>
<text class="xs m r3b" x="620" y="296" text-anchor="end">discarded: B is ahead</text>
<text class="xs m r3c" x="620" y="296" text-anchor="end">re-formed · 9 of 11 replay</text>
<text class="xs ok r3d" x="620" y="296" text-anchor="end">passed</text>
<text class="xs ok r3e" x="620" y="296" text-anchor="end">landed</text>
<rect class="track" x="296" y="310" width="324" height="10" rx="5"/>
<rect class="bar bar3" x="296" y="310" width="324" height="10" rx="5"/>
</g>
<path class="notify" d="M282,222 C250,222 250,208 222,208"/>
<line class="edge" x1="760" y1="340" x2="760" y2="322"/>
<line class="edge eA" x1="760" y1="312" x2="760" y2="260"/>
<line class="edge eC" x1="760" y1="242" x2="760" y2="190"/>
<circle class="commit" cx="760" cy="317" r="6"/>
<text class="m xs" x="774" y="321">before</text>
<g class="mA"><circle class="merge" cx="760" cy="251" r="8"/><circle class="mergein" cx="760" cy="251" r="3.5"/><text class="t sm" x="776" y="249">merge A</text><text class="m xs" x="776" y="264">verdict in trailers</text></g>
<g class="mC"><circle class="merge" cx="760" cy="181" r="8"/><circle class="mergein" cx="760" cy="181" r="3.5"/><text class="t sm" x="776" y="179">merge C</text><text class="m xs" x="776" y="194">verdict in trailers</text></g>
<g class="head"><rect class="pill" x="664" y="306" width="76" height="22" rx="11"/><text class="pillt" x="702" y="321" text-anchor="middle">bolt/pay</text></g>
<text class="m xs" x="664" y="356">moved only by sluice, from the</text>
<text class="m xs" x="664" y="370">revision the candidate was formed on</text>
<g class="cap cap1"><circle class="badge" cx="32" cy="412" r="11"/><text class="badget" x="32" y="416" text-anchor="middle">1</text><text class="t sm" x="50" y="408">Agents submit their work.</text><text class="t sm" x="50" y="425">None of them merges.</text></g>
<g class="cap cap2"><circle class="badge" cx="250" cy="412" r="11"/><text class="badget" x="250" y="416" text-anchor="middle">2</text><text class="t sm" x="268" y="408">Each candidate is tested</text><text class="t sm" x="268" y="425">exactly as it would land.</text></g>
<g class="cap cap3"><circle class="badge" cx="468" cy="412" r="11"/><text class="badget" x="468" y="416" text-anchor="middle">3</text><text class="t sm" x="486" y="408">A failure has one culprit,</text><text class="t sm" x="486" y="425">and only its agent is told.</text></g>
<g class="cap cap4"><circle class="badge" cx="686" cy="412" r="11"/><text class="badget" x="686" y="416" text-anchor="middle">4</text><text class="t sm" x="704" y="408">The branch moves only</text><text class="t sm" x="704" y="425">to what passed.</text></g>
</svg>

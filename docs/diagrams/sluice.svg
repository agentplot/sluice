21.2%{opacity:0} 22%{opacity:1} 32%{opacity:1} 32.8%{opacity:0} 100%{opacity:0}}.r2a{animation:k-r2a 16s linear infinite}@keyframes k-r2b{0%{opacity:0} 31.2%{opacity:0} 32%{opacity:1} 56%{opacity:1} 56.8%{opacity:0} 100%{opacity:0}}.r2b{animation:k-r2b 16s linear infinite}@keyframes k-r2c{0%{opacity:0} 55.2%{opacity:0} 56%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.r2c{animation:k-r2c 16s linear infinite}@keyframes k-l3a{0%{opacity:1} 60%{opacity:1} 60.8%{opacity:0} 99.2%{opacity:0} 100%{opacity:1}}.l3a{animation:k-l3a 16s linear infinite}@keyframes k-l3b{0%{opacity:0} 61.2%{opacity:0} 62%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.l3b{animation:k-l3b 16s linear infinite}@keyframes k-r3a{0%{opacity:0} 21.2%{opacity:0} 22%{opacity:1} 42%{opacity:1} 42.8%{opacity:0} 100%{opacity:0}}.r3a{animation:k-r3a 16s linear infinite}@keyframes k-r3b{0%{opacity:0} 41.2%{opacity:0} 42%{opacity:1} 62%{opacity:1} 62.8%{opacity:0} 100%{opacity:0}}.r3b{animation:k-r3b 16s linear infinite}@keyframes k-r3c{0%{opacity:0} 61.2%{opacity:0} 62%{opacity:1} 70%{opacity:1} 70.8%{opacity:0} 100%{opacity:0}}.r3c{animation:k-r3c 16s linear infinite}@keyframes k-r3d{0%{opacity:0} 69.2%{opacity:0} 70%{opacity:1} 80%{opacity:1} 80.8%{opacity:0} 100%{opacity:0}}.r3d{animation:k-r3d 16s linear infinite}@keyframes k-r3e{0%{opacity:0} 79.2%{opacity:0} 80%{opacity:1} 96%{opacity:1} 96.8%{opacity:0} 100%{opacity:0}}.r3e{animation:k-r3e 16s linear infinite}@keyframes k-strike{0%{opacity:0} 56%{opacity:0} 58%{opacity:1} 100%{opacity:1}}.strike{animation:k-strike 16s linear infinite}@keyframes k-bar1{0%{transform:scaleX(0);fill:var(--accent)} 20%{transform:scaleX(0);fill:var(--accent)} 36%{transform:scaleX(1);fill:var(--accent)} 37%{transform:scaleX(1);fill:var(--ok)} 96%{transform:scaleX(1);fill:var(--ok)} 100%{transform:scaleX(0);fill:var(--accent)}}@keyframes k-bar2{0%{transform:scaleX(0);fill:var(--accent)} 20%{transform:scaleX(0);fill:var(--accent)} 32%{transform:scaleX
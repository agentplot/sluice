<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Parallel and batch: four submissions on a 20-minute gate</title>
<desc id="dsc">Four submissions, A to D, arrive a minute apart on a branch whose tests take 20 minutes. With batch false and parallel 4, sluice tests main plus A, main plus A plus B, and so on, four runs at once, and all four land by minute 23. With batch true, main plus A starts alone; B, C and D wait while it is under test, then are tested together as one run that lands all three at minute 40: two runs, one at a time.</desc>
<style>
:root{--bg:#ebe9e2;--panel:#fbfaf7;--fg:#0e1116;--muted:#5d6370;--rule:#d5d2c8;
--accent:#2b313c;--soft:#e0ddd4;--ok:#1f8a4c;--bad:#c0392b;--ink:#f2f1ec}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--panel:#1b2029;--fg:#f2f1ec;
--muted:#9a9fab;--rule:#2c323d;--accent:#c9cbd2;--soft:#232933;--ok:#45c27a;--bad:#f08a7e;--ink:#0e1116}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono,.bart{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:var(--bg)} .t{fill:var(--fg)} .m{fill:var(--muted)} .ok{fill:var(--ok)} .bad{fill:var(--bad)}
.b{font-weight:600} .h{font-size:17px;font-weight:700} .hd{font-size:12px;letter-spacing:.06em;fill:var(--muted)}
.sm{font-size:13px} .xs{font-size:11.5px} .mono{font-size:12.5px}
.panel{fill:var(--soft);stroke:none}
.track{fill:var(--panel);stroke:var(--rule);stroke-width:1}
.bar{transform-box:fill-box;transform-origin:left center}
.bart{fill:var(--ink);font-size:11.5px;font-weight:600}
.wait{stroke:var(--muted);stroke-width:2;stroke-dasharray:4 4;transform-box:fill-box;transform-origin:left center}
.axis{stroke:var(--rule);stroke-width:1} .tick{fill:var(--muted);font-size:11px}
.play{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
.merge{fill:var(--ok)} .mergein{fill:var(--panel)}
.badge{fill:var(--accent)} .badget{fill:var(--ink);font-size:12px;font-weight:700}
.step{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.dot{fill:var(--accent)} .grid{stroke:var(--rule);stroke-width:1}
.slot{fill:var(--panel);stroke:var(--rule);stroke-width:1.5} .used{fill:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important;animation-delay:-16.5s!important}
.cap{animation:none!important;opacity:1}}
@keyframes k1{0%{transform:scaleX(0);fill:var(--accent)} 2%{transform:scaleX(0);fill:var(--accent)} 37.5556%{transform:scaleX(1);fill:var(--accent)} 37.9556%{transform:scaleX(1);fill:var(--ok)} 97%{transform:scaleX(1);fill:var(--ok)} 100%{transform:scaleX(0);fill:var(--accent)}}.k1{animation:k1 18s linear infinite}@keyframes k2{0%{opacity:0} 37.3556%{opacity:0} 37.9556%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k2{animation:k2 18s linear infinite}@keyframes k3{0%{opacity:0} 37.3556%{opacity:0} 37.9556%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k3{animation:k3 18s linear infinite}@keyframes k4{0%{transform:scaleX(0);fill:var(--accent)} 3.77778%{transform:scaleX(0);fill:var(--accent)} 39.3333%{transform:scaleX(1);fill:var(--accent)} 39.7333%{transform:scaleX(1);fill:var(--ok)} 97%{transform:scaleX(1);fill:var(--ok)} 100%{transform:scaleX(0);fill:var(--accent)}}.k4{animation:k4 18s linear infinite}@keyframes k5{0%{opacity:0} 39.1333%{opacity:0} 39.7333%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k5{animation:k5 18s linear infinite}@keyframes k6{0%{opacity:0} 39.1333%{opacity:0} 39.7333%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k6{animation:k6 18s linear infinite}@keyframes k7{0%{transform:scaleX(0);fill:var(--accent)} 5.55556%{transform:scaleX(0);fill:var(--accent)} 41.1111%{transform:scaleX(1);fill:var(--accent)} 41.5111%{transform:scaleX(1);fill:var(--ok)} 97%{transform:scaleX(1);fill:var(--ok)} 100%{transform:scaleX(0);fill:var(--accent)}}.k7{animation:k7 18s linear infinite}@keyframes k8{0%{opacity:0} 40.9111%{opacity:0} 41.5111%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k8{animation:k8 18s linear infinite}@keyframes k9{0%{opacity:0} 40.9111%{opacity:0} 41.5111%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k9{animation:k9 18s linear infinite}@keyframes k10{0%{transform:scaleX(0);fill:var(--accent)} 7.33333%{transform:scaleX(0);fill:var(--accent)} 42.8889%{transform:scaleX(1);fill:var(--accent)} 43.2889%{transform:scaleX(1);fill:var(--ok)} 97%{transform:scaleX(1);fill:var(--ok)} 100%{transform:scaleX(0);fill:var(--accent)}}.k10{animation:k10 18s linear infinite}@keyframes k11{0%{opacity:0} 42.6889%{opacity:0} 43.2889%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k11{animation:k11 18s linear infinite}@keyframes k12{0%{opacity:0} 42.6889%{opacity:0} 43.2889%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k12{animation:k12 18s linear infinite}@keyframes k13{0%{opacity:0} 42.6889%{opacity:0} 43.2889%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k13{animation:k13 18s linear infinite}@keyframes k14{0%{transform:scaleX(0);fill:var(--accent)} 2%{transform:scaleX(0);fill:var(--accent)} 37.5556%{transform:scaleX(1);fill:var(--accent)} 37.9556%{transform:scaleX(1);fill:var(--ok)} 97%{transform:scaleX(1);fill:var(--ok)} 100%{transform:scaleX(0);fill:var(--accent)}}.k14{animation:k14 18s linear infinite}@keyframes k15{0%{opacity:0} 37.3556%{opacity:0} 37.9556%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k15{animation:k15 18s linear infinite}@keyframes k16{0%{opacity:0} 37.3556%{opacity:0} 37.9556%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k16{animation:k16 18s linear infinite}@keyframes k17{0%{transform:scaleX(0)} 3.77778%{transform:scaleX(0)} 37.5556%{transform:scaleX(1)} 97%{transform:scaleX(1)} 100%{transform:scaleX(0)}}.k17{animation:k17 18s linear infinite}@keyframes k18{0%{opacity:0} 4.17778%{opacity:0} 4.77778%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k18{animation:k18 18s linear infinite}@keyframes k19{0%{transform:scaleX(0);fill:var(--accent)} 37.5556%{transform:scaleX(0);fill:var(--accent)} 73.1111%{transform:scaleX(1);fill:var(--accent)} 73.5111%{transform:scaleX(1);fill:var(--ok)} 97%{transform:scaleX(1);fill:var(--ok)} 100%{transform:scaleX(0);fill:var(--accent)}}.k19{animation:k19 18s linear infinite}@keyframes k20{0%{opacity:0} 72.9111%{opacity:0} 73.5111%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k20{animation:k20 18s linear infinite}@keyframes k21{0%{opacity:0} 72.9111%{opacity:0} 73.5111%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k21{animation:k21 18s linear infinite}@keyframes k22{0%{opacity:0} 72.9111%{opacity:0} 73.5111%{opacity:1} 97%{opacity:1} 97.6%{opacity:0} 100%{opacity:0}}.k22{animation:k22 18s linear infinite}@keyframes k23{0%{transform:translateX(0px)} 2%{transform:translateX(0px)} 82%{transform:translateX(620px)} 97%{transform:translateX(620px)} 100%{transform:translateX(0px)}}.k23{animation:k23 18s linear infinite}@keyframes k24{0%{opacity:0.35} 1.4%{opacity:0.35} 2%{opacity:1} 30%{opacity:1} 30.6%{opacity:0.35} 100%{opacity:0.35}}.k24{animation:k24 18s linear infinite}@keyframes k25{0%{opacity:0.35} 29.4%{opacity:0.35} 30%{opacity:1} 62%{opacity:1} 62.6%{opacity:0.35} 100%{opacity:0.35}}.k25{animation:k25 18s linear infinite}@keyframes k26{0%{opacity:0.35} 61.4%{opacity:0.35} 62%{opacity:1} 97%{opacity:1} 97.6%{opacity:0.35} 100%{opacity:0.35}}.k26{animation:k26 18s linear infinite}</style>
<rect class="bg" width="900" height="470" rx="10"/>
<text class="h" x="20" y="32">Four submissions, a 20-minute gate</text>
<text class="m sm" x="20" y="52">A, B, C and D are submitted a minute apart.</text>
<rect class="panel" x="16" y="66" width="868" height="148" rx="8"/>
<text class="hd" x="34" y="86">BATCH = FALSE · PARALLEL = 4</text>
<text class="t mono" x="34" y="111">main + A</text>
<rect class="track" x="250.0" y="96" width="275.6" height="20" rx="4"/>
<rect class="bar k1" x="250.0" y="96" width="275.6" height="20" rx="4"/>
<text class="bart k2" x="258.0" y="110">passed · A lands</text>
<g class="k3"><circle class="merge" cx="525.6" cy="106" r="7"/><circle class="mergein" cx="525.6" cy="106" r="3"/></g>
<text class="t mono" x="34" y="137">main + A + B</text>
<rect class="track" x="263.8" y="122" width="275.6" height="20" rx="4"/>
<rect class="bar k4" x="263.8" y="122" width="275.6" height="20" rx="4"/>
<text class="bart k5" x="271.8" y="136">passed · B lands</text>
<g class="k6"><circle class="merge" cx="539.3" cy="132" r="7"/><circle class="mergein" cx="539.3" cy="132" r="3"/></g>
<text class="t mono" x="34" y="163">main + A + B + C</text>
<rect class="track" x="277.6" y="148" width="275.6" height="20" rx="4"/>
<rect class="bar k7" x="277.6" y="148" width="275.6" height="20" rx="4"/>
<text class="bart k8" x="285.6" y="162">passed · C lands</text>
<g class="k9"><circle class="merge" cx="553.1" cy="158" r="7"/><circle class="mergein" cx="553.1" cy="158" r="3"/></g>
<text class="t mono" x="34" y="189">main + A + B + C + D</text>
<rect class="track" x="291.3" y="174" width="275.6" height="20" rx="4"/>
<rect class="bar k10" x="291.3" y="174" width="275.6" height="20" rx="4"/>
<text class="bart k11" x="299.3" y="188">passed · D lands</text>
<g class="k12"><circle class="merge" cx="566.9" cy="184" r="7"/><circle class="mergein" cx="566.9" cy="184" r="3"/></g>
<text class="b sm ok k13" x="560" y="86">4 runs at once · all landed by 23 min</text>
<rect class="panel" x="16" y="226" width="868" height="122" rx="8"/>
<text class="hd" x="34" y="246">BATCH = TRUE · PARALLEL = 4</text>
<text class="t mono" x="34" y="273">main + A</text>
<rect class="track" x="250.0" y="258" width="275.6" height="20" rx="4"/>
<rect class="bar k14" x="250.0" y="258" width="275.6" height="20" rx="4"/>
<text class="bart k15" x="258.0" y="272">passed · A lands</text>
<g class="k16"><circle class="merge" cx="525.6" cy="268" r="7"/><circle class="mergein" cx="525.6" cy="268" r="3"/></g>
<text class="t mono" x="34" y="311">main + B + C + D</text>
<line class="wait k17" x1="263.8" y1="306" x2="525.6" y2="306"/>
<text class="m xs k18" x="267.8" y="300">B, C, D queue while A is tested</text>
<rect class="track" x="525.6" y="296" width="275.6" height="20" rx="4"/>
<rect class="bar k19" x="525.6" y="296" width="275.6" height="20" rx="4"/>
<text class="bart k20" x="533.6" y="310">passed · B, C, D land together</text>
<g class="k21"><circle class="merge" cx="801.1" cy="306" r="7"/><circle class="mergein" cx="801.1" cy="306" r="3"/></g>
<text class="b sm ok k22" x="560" y="246">2 runs, one at a time · all landed by 40 min</text>
<line class="axis" x1="250" y1="360" x2="870" y2="360"/>
<line class="axis" x1="250.0" y1="360" x2="250.0" y2="365"/>
<text class="tick" x="250.0" y="378" text-anchor="middle">0 min</text>

<line class="play k23" x1="250" y1="66" x2="250" y2="360"/>
<g class="cap k24"><circle class="badge" cx="32" cy="422" r="11"/><text class="badget" x="32" y="426" text-anchor="middle">1</text><text class="t sm" x="50" y="418">Parallel bets the ones ahead pass:</text><text class="t sm" x="50" y="435">each starts on arrival.</text></g>
<g class="cap k25"><circle class="badge" cx="324" cy="422" r="11"/><text class="badget" x="324" y="426" text-anchor="middle">2</text><text class="t sm" x="342" y="418">Batch tests one run at a time;</text><text class="t sm" x="342" y="435">what queues meanwhile is the next batch.</text></g>
<g class="cap k26"><circle class="badge" cx="616" cy="422" r="11"/><text class="badget" x="616" y="426" text-anchor="middle">3</text><text class="t sm" x="634" y="418">Parallel lands sooner;</text><text class="t sm" x="634" y="435">batch uses fewer runs.</text></g>
</svg>

# moon runs sluice's checks: one project per crate, per plugin and for the
# site, each holding its own checks (core.21); the root holds what spans
# the tree. Each check is tagged with its tier, which a branch's policy
# requires by tag:
#   check-fast    the cargo tests over the fakes, format and lint: seconds
#   check-tools   the profiles against real git, moon and worktrunk on
#                 scratch repositories, and the conformance suite over them
#   check-e2e     e2e.sh, a whole repository driven through wt submit
# The cargo tests are also tagged `cargo-test`. A task whose inputs are identical to a run that passed on
# this host, in any worktree, replays from .moon/cache/outputs (a link into
# the git common dir, made by devenv.nix) instead of running again, so every
# task's inputs name everything its tests read from the tree.
$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  seams: 'crates/sluice-seams'
  core: 'crates/sluice-core'
  fakes: 'crates/sluice-fakes'
  conformance: 'crates/sluice-conformance'
  cli: 'crates/sluice'
  site: 'site'
  plugin-sluice: 'plugins/sluice'
  plugin-board: 'plugins/sluice-board'
  plugin-herdr: 'plugins/herdr'
  root: '.'

# --affected compares against the merge-base with main.
vcs:
  client: 'git'
  defaultBranch: 'main'

telemetry: false

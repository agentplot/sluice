extends: existence
message: "State the point directly instead of 'it is not X, it is Y'."
description: "The construction spends a clause on what the thing is not. The chapter has room only for what it is."
link: https://github.com/agentplot/blueprints/blob/main/books/research/2026-10-13-voice-and-style.md#6-what-a-chapter-never-does-and-where-it-came-from
level: warning
ignorecase: true
raw:
  - '\b(?:it''s|it is|this is|that''s|that is) not [^.;]{1,60}[,;] (?:it''s|it is|this is|but)\b'

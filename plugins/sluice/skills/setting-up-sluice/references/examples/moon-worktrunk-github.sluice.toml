# .config/sluice.toml: moon in a devenv shell, a sandbox, two tiers of
# branches, main on GitHub taking pull requests. Agents work in worktrunk
# worktrees and finish with `wt submit <branch>`. This is close to sluice's
# own policy.

[tests]
runner = "moon"
# The shell the tasks run in: printed outside the sandbox, sourced inside.
toolchain = ["devenv", "print-dev-env"]
release = "docker compose -p \"$SLUICE_PLACE\" down -v" # what the tests hand off

[checkout]
ports = ["db"] # SLUICE_PORT_DB, held per checkout

[executor]
kind = "sandbox"      # writes only the checkout and SLUICE_TMP (macOS)
network = "localhost"
docker = true         # the integration tests start a database container

[landing]
subject = "chore(land): #{id} {from}"

# The hosts whose runs count on main, each by its SSH key. Naming any
# keeps main's state on origin, where the host that keeps main takes its
# pull requests in; a branch that takes pull requests needs them.
[signers.box]
ssh = ".config/sluice.boxes" # one line per host's key

# Small, fast landings many times a day. feature/* is a placeholder:
# name the pattern as the project names its branches.
[branches."feature/*"]
required = ["#check-fast"]
parallel = 4
trust = ["open", "sandbox", "cache"]

# Whole features; every required task really runs.
[branches.main]
required = ["#check-fast", "#check-tools"]
parallel = 2
batch = true                               # test the longest combination, bisect on failure
timeout = "30m"
trust = ["box"]                            # the signers whose runs count here
remote = "origin"                          # fetched every round, landed by a leased push

[branches.main.pull_requests]
reviews = 1
checks = []

# .config/sluice.toml: many hosts as peers, with no server. The queue for
# every branch with a remote lives on origin under refs/sluice/; the
# operator's standing executors take main's runs, one per system, and the
# session hosts take the feature branches'. main must pass cli:build on three
# systems.

[tests]
runner = "moon"

[checkout]
ports = ["api", "web"]

[systems]
linux-x64 = { os = "linux", arch = "x86_64" }
linux-arm64 = { os = "linux", arch = "aarch64" }
macos-arm64 = { os = "macos", arch = "aarch64" }

[signers.box]
ssh = ".config/sluice.boxes" # one line per box's key: build-1 (linux-x64), build-2 (linux-arm64), mac-1 (macos-arm64)
confined = true              # container checkouts; no session reaches its engine

[signers.sessions]
ssh = ".config/sluice.sessions" # one line per session host's key
confined = false

# The forge's round job, which takes main's pull requests in with every host
# off: `sluice init actions` adds these two tables and writes its workflow.
[signers.forge]
github = { workflow = ".github/workflows/sluice.yml", ref = "refs/heads/main" }

[pools.forge]
github = { workflow = ".github/workflows/sluice.yml", ref = "refs/heads/main" }
signer = "forge"                                                                # no runners: its jobs run rounds alone

# feature/* is a placeholder: name the pattern as the project names its branches
[branches."feature/*"]
remote = "origin"
required = ["#check-fast"]
trust = ["sessions", "box"] # no systems named: any one system

[branches.main]
remote = "origin"
required = ["#check-fast", "#integration", "cli:build"]
trust = ["box"]
confined = true
systems = ["linux-x64"]
batch = true
timeout = "45m"

[branches.main.systems_for]
"cli:build" = ["linux-x64", "linux-arm64", "macos-arm64"]

[branches.main.pull_requests]
reviews = 1
checks = ["codeql"] # other systems' checks; sluice's own are its results

$schema: 'https://moonrepo.dev/schemas/project.json'

# The Claude Code plugin: its skills, and its hooks in shell.
language: 'bash'
layer: 'application'

tasks:
  # The hooks on a scratch repository.
  hooks:
    command: 'bash tests/hooks.sh'
    inputs: ['scripts/**/*', 'tests/**/*', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  # The plain-clone conversion on scratch clones, with a stand-in lsof.
  lay-out:
    command: 'bash tests/lay-out.sh'
    inputs: ['scripts/**/*', 'tests/**/*', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  # The manifest and its skills, by the pinned Claude Code.
  validate:
    command: '../claude.sh plugin validate --strict .'
    inputs: ['.claude-plugin/**/*', 'hooks/**/*', 'scripts/**/*', 'skills/**/*', '/plugins/claude.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]

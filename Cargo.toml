[workspace]
resolver = "2"
members = [
  "crates/sluice-seams",
  "crates/sluice-core",
  "crates/sluice-fakes",
  "crates/sluice-conformance",
  "crates/sluice",
]

[workspace.package]
# The released version is the tag's, given to the build as SLUICE_VERSION.
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gix = { version = "0.89", default-features = false, features = [
  "max-performance-safe",
  "sha1",
  "basic",
  "revision",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Signed run records (ADR 0032): DSSE digests and moon's keys.
sha2 = "0.10"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.31", default-features = false, features = [
  "signal",
  "process",
  "hostname",
] }
# Telemetry (ADRs 0014, 0022): the core emits tracing spans and events;
# the binary exports them over OTLP/HTTP when asked to.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "registry",
  "std",
] }
tracing-opentelemetry = { version = "0.34", default-features = false, features = [
  "metrics",
] }
opentelemetry = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry-appender-tracing = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "http-proto",
  "reqwest-blocking-client",
] }
# What a failure's output is scrubbed of before it is sent (ADR 0022).
regex = "1"

# sluice's identity on a forge: a JWT signed with the app's key (RS256)
# and a blocking HTTPS client for the forge's API.
jsonwebtoken = "9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

[workspace]
resolver = "2"
members = [
  "crates/sluice-seams",
  "crates/sluice-core",
  "crates/sluice-fakes",
  "crates/sluice-conformance",
  "crates/sluice",
]

[workspace.package]
# main gives 0.0.0. A release's tag names a release commit that writes the
# release's version here and into every file that carries sluice's
# (set-version.sh), and root:versions holds them equal (record 0111).
version = "0.94.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gix = { version = "0.89", default-features = false, features = [
  "max-performance-safe",
  "sha1",
  "basic",
  "revision",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Signed run records (ADR 0032): DSSE digests and moon's keys.
sha2 = "0.10"
base64 = "0.22"
ssh-key = { version = "0.6", features = ["ed25519", "std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.31", default-features = false, features = [
  "signal",
  "process",
  "hostname",
  "user",
  "fs",
] }
# Telemetry (ADRs 0014, 0022): the core emits tracing spans and events;
# the binary exports them over OTLP/HTTP when asked to.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "registry",
  "std",
] }
tracing-opentelemetry = { version = "0.34", default-features = false, features = [
  "metrics",
] }
opentelemetry = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry-appender-tracing = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "http-proto",
  "reqwest-blocking-client",
] }
# What a failure's output is scrubbed of before it is sent (ADR 0022).
regex = "1"

# sluice's identity on a forge: a JWT signed with the app's key (RS256)
# and a blocking HTTPS client for the forge's API.
jsonwebtoken = "9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Every call to a remote runs under one retry policy (ADR 0062): a
# maintained crate's backoff, blocking, with no async runtime.
backon = { version = "1.6", default-features = false, features = [
  "std",
  "std-blocking-sleep",
] }

# A submission's outcome is a weir delivery (record 0102): weir's form,
# its calls and its pack, at the revision a change names (D1). A call to
# a remote runs to the family's limit for a try, ended with everything it
# started, through weir's crate for it (record 0109 as amended 2026-11-11;
# agentplot/weir record 0008).
weir-delivery = { git = "https://github.com/agentplot/weir", rev = "9cba69196e9269a36b02024861340355bdbe6d4b" }
weir-pack = { git = "https://github.com/agentplot/weir", rev = "9cba69196e9269a36b02024861340355bdbe6d4b" }
weir-bounded = { git = "https://github.com/agentplot/weir", rev = "9cba69196e9269a36b02024861340355bdbe6d4b" }

# The tests' container engine over TLS: its certificates, made in each
# test's scratch directory, and its server, on the ring provider ureq uses.
rcgen = { version = "0.14", default-features = false, features = [
  "pem",
  "ring",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

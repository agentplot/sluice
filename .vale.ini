# The documentation site's prose, checked. The rules are styles/Sluice;
# `prose` from the devenv shell runs them over site/src/content/docs,
# leaving out the pages made from other files: decisions/, generated from
# docs/adr, which may narrate what was weighed, and architecture/rules.md,
# made from docs/architecture/core.md (site:rules), whose rules keep the
# statement's words and are changed in core.md, not on the page. The
# site's register is the README's: plain words, the ones a user sees,
# nothing sold.
StylesPath = styles
Vocab = Sluice
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, Sluice
Vale.Spelling = NO
# Starlight's directives and import lines are not prose.
TokenIgnores = (:::[a-z]+(?:\[[^\]]*\])?), (^import .*$)

# A decision record says what was weighed, in the statement's words.
[docs/adr/*.md]
Sluice.MetaNarration = NO
Sluice.Terms = NO

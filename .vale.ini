# The documentation site's prose, checked. The rules are styles/Sluice;
# `prose` from the devenv shell runs them over site/src/content/docs,
# leaving out decisions/, which is generated from docs/adr and may
# narrate what was weighed. The site's register is the README's: plain
# words, the ones a user sees, nothing sold.
StylesPath = styles
Vocab = Sluice
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, Sluice
Vale.Spelling = NO
# Starlight's directives and import lines are not prose.
TokenIgnores = (:::[a-z]+(?:\[[^\]]*\])?), (^import .*$)

# The rules page mirrors the statement's rules and keeps its design words.
[site/src/content/docs/architecture/rules.md]
Sluice.Terms = NO

# A decision record says what was weighed, in the statement's words.
[docs/adr/*.md]
Sluice.MetaNarration = NO
Sluice.Terms = NO
